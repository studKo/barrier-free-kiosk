<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>컴포즈커피 키오스크</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <section id="order-type-screen" class="screen active">
    <div class="choice-wrap">
      <div class="brand-box">
        <h1 class="brand-title">COMPOSE COFFEE</h1>
        <p class="brand-subtitle">주문 방법을 선택해주세요</p>
      </div>

      <div class="choice-buttons">
        <button id="eat-in-btn" class="choice-btn" type="button">
          <span class="choice-emoji">🍽️</span>
          <span class="choice-title">매장에서 먹기</span>
          <span class="choice-desc">매장 안에서 음료를 이용할게요</span>
        </button>

        <button id="take-out-btn" class="choice-btn" type="button">
          <span class="choice-emoji">🥡</span>
          <span class="choice-title">포장해가기</span>
          <span class="choice-desc">포장해서 가져갈게요</span>
        </button>

        <button id="tutorial-start-btn" class="choice-btn" type="button"
          style="margin-top: 30px; border-color: #d32f2f; background-color: #fff;">
          <span class="choice-emoji">💡</span>
          <span class="choice-title" style="color: #d32f2f;">도움말 (튜토리얼 시작)</span>
          <span class="choice-desc">처음이시라면 여기를 눌러 따라해보세요!</span>
        </button>
      </div>

      <p class="guide-text">원하시는 주문 방식을 눌러주세요</p>
    </div>
  </section>

  <section id="menu-screen" class="screen hidden">
    <header class="header">
      <h1>컴포즈커피</h1>
      <p id="order-type-label">주문 방식이 여기에 표시됩니다</p>
    </header>

    <main class="container">
      <section class="menu-section">
        <div class="category-tabs" id="category-tabs">
          <button class="tab active" data-category="커피" type="button">커피</button>
          <button class="tab" data-category="디카페인" type="button">디카페인</button>
          <button class="tab" data-category="논커피" type="button">논커피</button>
          <button class="tab" data-category="스무디/프라페" type="button">스무디/프라페</button>
          <button class="tab" data-category="에이드/주스" type="button">에이드/주스</button>
          <button class="tab" data-category="티" type="button">티</button>
          <button class="tab" data-category="푸드/디저트" type="button">푸드/디저트</button>
        </div>

        <div id="menu-list" class="menu-list"></div>
      </section>

      <aside class="cart-section">
        <div class="cart-items-area">
          <div class="cart-title">장바구니</div>
          <div id="cart-list" class="cart-list"></div>
        </div>

        <div class="cart-summary-area">
          <div class="total">
            <span>총 결제 금액</span>
            <strong id="total-price">0원</strong>
          </div>
          <div class="footer-buttons">
            <button id="clear-all-btn" class="clear-btn" type="button">전체 취소</button>
            <button id="pay-btn" class="pay-btn" type="button" disabled>결제하기</button>
          </div>
        </div>
      </aside>
    </main>
  </section>

  <div id="option-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-menu-name">메뉴 이름</h2>
        <p id="modal-menu-price">1,500원</p>
      </div>

      <div class="option-group">
        <h3>1. 온도 선택 (필수)</h3>
        <div class="radio-group" id="temp-options">
          <button class="opt-btn active" data-type="temp" data-value="HOT">HOT (따뜻하게)</button>
          <button class="opt-btn" data-type="temp" data-value="ICED">ICED (차갑게)</button>
        </div>
      </div>

      <div class="option-group" id="ice-option-group" style="display: none;">
        <h3>2. 얼음양 선택</h3>
        <div class="radio-group">
          <button class="opt-btn" data-type="ice" data-value="얼음 빼기">빼기</button>
          <button class="opt-btn" data-type="ice" data-value="얼음 적게">적게</button>
          <button class="opt-btn active" data-type="ice" data-value="기본">기본</button>
          <button class="opt-btn" data-type="ice" data-value="얼음 많이">많이</button>
        </div>
      </div>

      <div class="option-group">
        <h3>3. 추가 옵션 (선택)</h3>
        <div class="radio-group" id="extra-options">
          <button class="opt-btn active" data-type="extra" data-value="선택 안함" data-price="0">선택 안함</button>
          <button class="opt-btn" data-type="extra" data-value="샷 추가" data-price="500">샷 추가 (+500원)</button>
          <button class="opt-btn" data-type="extra" data-value="시럽 추가" data-price="500">시럽 추가 (+500원)</button>
        </div>
      </div>

      <div class="modal-actions">
        <button id="modal-cancel-btn" class="cancel-btn" type="button">취소하기</button>
        <button id="modal-add-btn" class="add-btn" type="button">
          장바구니 담기 (<span id="modal-total-price">0</span>원)
        </button>
      </div>
    </div>
  </div>

  <section id="payment-wait-screen" class="screen hidden">
    <div class="choice-wrap">
      <div class="brand-box">
        <h1 class="brand-title">결제 대기 중...</h1>
        <p class="brand-subtitle">오른쪽 카드를 드래그해서<br>키오스크 하단의 결제 투입구에 넣으세요.</p>
      </div>

      <button id="cancel-payment-btn" class="clear-btn" style="margin-top: 40px; width: 100%;">결제 취소하기</button>
    </div>
  </section>

  <section id="complete-screen" class="screen hidden">
    <div class="choice-wrap">
      <div class="brand-box">
        <h1 class="brand-title">결제가 완료되었습니다</h1>
        <p class="brand-subtitle" id="order-number">주문번호: 101</p>
      </div>
      <p class="guide-text">잠시 후 처음 화면으로 돌아갑니다...</p>
    </div>
  </section>

  <div id="tutorial-dim" class="hidden"></div>
  <div id="tutorial-tooltip" class="hidden">
    <p id="tutorial-text">가이드라인 텍스트</p>
    <button id="tutorial-next-btn" type="button">다 음</button>
  </div>

  <script src="ui.js"></script>
</body>

</html>
