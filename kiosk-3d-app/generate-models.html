<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLB 모델 생성기</title>
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f2f4f6;
      color: #191f28;
    }
    .container {
      text-align: center;
      padding: 3rem;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      max-width: 500px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    #status { 
      font-size: 1.2rem; 
      color: #3182f6; 
      margin-top: 1rem;
      font-weight: 600;
    }
    .note {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #666;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏭 3D 모델 자동 생성기</h1>
    <p>이 페이지를 열면 Three.js로 키오스크와 카드 모델을<br>자동 생성하여 .glb 파일로 다운로드합니다.</p>
    <div id="status">준비 중...</div>
    <p class="note">
      다운로드된 <strong>kiosk.glb</strong>, <strong>card.glb</strong> 파일을<br>
      <code>public/models/</code> 폴더에 넣으면 앱이 자동으로 로드합니다.
    </p>
  </div>
  <script type="module" src="./generate-models.js"></script>
</body>
</html>
