<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGV 키오스크 통합 시뮬레이터</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="kiosk-device">
    <div id="home-screen" class="screen active">
        <div class="event-banner"><h2 style="color:white;">WELCOME TO CGV</h2></div>
        <div style="height:100px; display:flex; justify-content:center; align-items:center;">
            <button class="btn-start-red" onclick="showScreen('menu-screen')">시작하기</button>
        </div>
    </div>

    <div id="menu-screen" class="screen">
        <div class="header-red">서비스 선택</div>
        <div style="flex:1; display:flex; justify-content:center; align-items:center;">
            <div class="menu-group">
                <button class="menu-btn active" onclick="showScreen('schedule-screen')">티켓구매</button>
                <button class="menu-btn" onclick="alert('예매 내역을 조회합니다.')">티켓출력</button>
                <button class="menu-btn" onclick="handleRefund()">환불하기</button>
            </div>
        </div>
    </div>

    <div id="schedule-screen" class="screen">
        <div class="header-red">
            <button class="btn-back-icon" onclick="showScreen('menu-screen')">〈</button>
            상영 시간 선택
        </div>
        <div class="schedule-grid" id="schedule-list"></div>
    </div>

    <div id="people-screen" class="screen">
        <div class="header-red">
            <button class="btn-back-icon" onclick="showScreen('schedule-screen')">〈</button>
            인원 선택
        </div>
        <div class="people-content" id="people-rows"></div>
        <div class="footer-total">총 인원: <span id="total-count" style="color:#e71a0f;">0</span>명</div>
        <div class="btn-bottom-group">
            <button class="btn-footer btn-red" onclick="completePeople()">좌석선택</button>
        </div>
    </div>

    <div id="seat-screen" class="screen">
        <div class="header-red">
            <button class="btn-back-icon" onclick="showScreen('people-screen')">〈</button>
            좌석 선택
        </div>
        <div class="seat-viewport">
            <div class="cinema-screen">SCREEN</div>
            <div class="seat-map-container"><div id="seat-map" class="seat-map"></div></div>
        </div>
        <div style="background:white; padding:15px; border-top:1px solid #ddd; display:flex; align-items:center; z-index:15;">
            <div style="flex:1; font-size:18px;">선택: <b id="seat-info">-</b></div>
            <button class="btn-red" style="font-size: 24px; padding:10px 20px; border:none; border-radius:5px; font-weight:bold; color:white;" onclick="renderPayment()">결제하기</button>
        </div>
    </div>

    <div id="payment-screen" class="screen">
        <div class="header-red">
            <button class="btn-back-icon" onclick="showScreen('seat-screen')">〈</button>
            결제하기
        </div>
        <div class="pay-content">
            <div class="pay-card">
                <h3 id="pay-title" style="margin-top:0;">영화 제목</h3>
                <div class="pay-row"><span>상영 시간</span> <span id="pay-time">00:00</span></div>
                <div class="pay-row"><span>선택 좌석</span> <span id="pay-seats">-</span></div>
                <div class="pay-row"><span>인원 구성</span> <span id="pay-people">-</span></div>
                <div class="pay-total">합계: <span id="pay-amount">0</span>원</div>
            </div>
        </div>
        <div class="btn-bottom-group">
            <button class="btn-footer btn-red" onclick="finishPayment()">최종 결제 완료</button>
        </div>
    </div>
</div>

<script src="ui.js"></script>
</body>
</html>
