<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 키오스크 교육 (배리어프리)</title>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/src/styles/main.css" />

</head>

<body>
  <header class="top-bar">
    <h1>키오스크 연습하기</h1>
    <div class="controls">
      <label for="camera-mode" class="a11y-label">사용자 시점 설정:</label>
      <select id="camera-mode" class="a11y-select">
        <option value="senior">일반 사용자</option>
        <option value="wheelchair">휠체어 사용자</option>
      </select>
    </div>
  </header>

  <main class="app-container">

    <section class="pane quest-pane" aria-label="현재 학습 목표와 진행 상태">
      <div id="brand-selection">
        <h2>어떤 키오스크를<br>연습할까요?</h2>
        <div class="brand-grid">
          <button class="brand-btn" data-brand="mcdonalds">맥도날드</button>
          <button class="brand-btn" data-brand="compose">컴포즈커피</button>
          <button class="brand-btn" data-brand="hospital">병원</button>
          <button class="brand-btn" data-brand="cgv">CGV</button>
          <button class="brand-btn" data-brand="busterminal">버스터미널</button>
        </div>
      </div>

      <div id="quest-content" style="display: none;">
        <h2>이번 목표</h2>
        <div class="quest-card">
          <p class="quest-text" id="quest-text-1">연습할 브랜드를 선택해주세요.</p>
        </div>
        <div id="status-message" class="status-message" role="alert" aria-live="assertive">
          현재 상태: 대기 중
        </div>
      </div>
    </section>

    <section class="pane render-pane" aria-label="3D 키오스크 화면">
      <div id="css-container"></div>
      <div id="canvas-container"></div>
      <div id="custom-toast" class="toast" role="alert" aria-live="assertive"></div>

      <div class="zoom-controls">
        <button id="zoom-in-btn" class="zoom-btn" aria-label="확대">+</button>
        <button id="zoom-out-btn" class="zoom-btn" aria-label="축소">−</button>
      </div>
    </section>

    <section class="pane tools-pane" aria-label="조작 도구">
      <h2>내 물건</h2>
      <p class="helper-text">아래 물건을 클릭하면 화면에 나타납니다.<br>드래그해서 알맞은 곳에 사용하세요.</p>

      <button id="spawn-card-btn" class="card-spawn-btn" aria-label="신용카드 꺼내기">
        <div class="legend-icon color-blue"></div>
        <span>내 신용카드 꺼내기</span>
      </button>

      <button id="spawn-receipt-btn" class="card-spawn-btn" aria-label="진료카드 꺼내기"
        style="display: none; margin-top: 10px;">
        <div class="legend-icon" style="background-color: #ffffff; border: 1px solid #ccc;"></div>
        <span>진료카드/바코드 꺼내기</span>
      </button>

      <button id="reset-btn" class="a11y-button reset-btn-bottom">처음부터 다시하기</button>
    </section>
  </main>

  <script type="module" src="./src/core/main.js"></script>
</body>

</html>
