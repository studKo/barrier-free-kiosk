<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>출력 완료</title>
  <link rel="stylesheet" href="complete.css"> 
</head>
<body>
  <div id="payment-container">
    
    <header class="gradient-header">
      <div class="logo-small">세종충남대학교병원</div>
      <h1>수납 및 처방전발행</h1>
      <div class="step-nav">
        <span class="step active"><span class="step-num">4</span> 출력 완료</span>
      </div>
    </header>

    <main class="payment-content">
      <div class="final-complete-screen">
          <h2 class="final-title">출력이 완료되었습니다<br>이용해 주셔서 감사합니다</h2>
          
          <div class="teal-divider"></div>

          <div class="printer-graphic">
              <div class="printer-slot"></div>
              <div class="print-paper">출력물</div>
          </div>
      </div>
    </main>

    <footer class="bottom-actions">
      <button id="parking-btn" class="parking-btn">주차등록/변경</button> 
    </footer>

  </div>

  <script src="complete.js"></script> 
</body>
</html>
